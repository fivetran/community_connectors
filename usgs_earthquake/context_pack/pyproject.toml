# Build backend configuration for editable installs (`pip install -e ...`).
# We use setuptools here so pip can read this manifest and install dependencies.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# This context pack is a utility workspace (scripts + dbt/ + agent/), not a distributable Python package.
# Disable package/module auto-discovery to avoid setuptools flat-layout discovery errors.
# Scripts are executed directly from source; this project entry is dependency-only metadata.
[tool.setuptools]
packages = []
py-modules = []

[project]
name = "usgs-earthquake-context-pack"
version = "0.1.0"
description = "This directory gives an AI agent governed context for the earthquake table that the usgs_earthquake connector syncs."
requires-python = ">=3.10,<=3.14"
dependencies = [
    "anthropic==1.1.0",
    "dbt-core==1.11.11",
    "dbt-duckdb==1.11.0",
    "dbt-metricflow==0.14.0",
    "duckdb==1.5.5",
    "metricflow==0.212.0",
    "PyYAML==6.0.3",
]
