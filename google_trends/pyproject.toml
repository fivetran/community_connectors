[project]
name = "google-trends"
version = "0.1.0"
description = "This connector syncs Google Trends interest-over-time data into Fivetran, allowing you to track search interest for specific keywords across different regions and time periods."
requires-python = ">=3.10,<3.15"
dependencies = [
    "pytrends==4.9.2",
    "pandas==3.0.0",
]
