version: 2

# Generic question shapes, no make or model baked in. The dbt MCP server lists these (list_saved_queries) but has no
# tool that runs one, so the agent runs a saved query by passing its metrics, group_by and where to query_metrics,
# adding the make or model the question names.

saved_queries:
  - name: campaigns_by_make_component
    description: >
      Recall campaigns per make and component group. Filter on recall_row__make for one make; the top component group
      is the first row. A campaign covering two makes counts once under each.
    query_params:
      metrics:
        - campaign_count
      group_by:
        - "Dimension('recall_row__make')"
        - "Dimension('recall_row__component_group')"

  - name: campaigns_by_model_year
    description: >
      Recall campaigns per configured model and model year. Filter on recall_row__model (the configured name). Never
      add the years up for "the model": a campaign spanning years would count more than once; use campaign_count
      filtered on the model with no year instead.
    query_params:
      metrics:
        - campaign_count
      group_by:
        - "Dimension('recall_row__make')"
        - "Dimension('recall_row__model')"
        - "Dimension('recall_row__model_year')"

  - name: flagged_campaigns
    description: Campaigns that advise parking outside or not driving, or carry an over-the-air remedy, one row each.
    query_params:
      metrics:
        - park_outside_campaigns
        - park_it_campaigns
        - over_the_air_campaigns
      group_by:
        - "Entity('campaign')"
        - "Dimension('campaign__makes')"
      where:
        - "{{ Dimension('campaign__park_outside') }} or {{ Dimension('campaign__park_it') }} or {{ Dimension('campaign__over_the_air_update') }}"

  - name: models_without_campaigns
    description: Configured models with no recall campaign in the window, one row each with a 1.
    query_params:
      metrics:
        - models_without_campaigns
      group_by:
        - "Entity('configured_model')"
      where:
        - "{{ Dimension('configured_model__has_campaigns') }} = false"

  - name: multi_model_campaigns
    description: Campaigns covering more than one configured model, widest first by configured_models.
    query_params:
      metrics:
        - multi_model_campaigns
      group_by:
        - "Entity('campaign')"
        - "Dimension('campaign__configured_models')"
        - "Dimension('campaign__models')"
      where:
        - "{{ Dimension('campaign__configured_models') }} > 1"

  - name: report_window
    description: The report-date window every answer names, and how many campaigns it holds.
    query_params:
      metrics:
        - first_report_date
        - last_report_date
        - campaign_count
