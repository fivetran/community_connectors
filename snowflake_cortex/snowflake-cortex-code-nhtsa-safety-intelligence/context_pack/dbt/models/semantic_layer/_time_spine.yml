version: 2

models:
  - name: metricflow_time_spine
    description: Daily calendar from 2015-01-01 to 2030-12-31 for the dbt Semantic Layer.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day.
        granularity: day
        data_tests:
          - unique
          - not_null
