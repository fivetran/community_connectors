[project]
name = "sftp-connector-bai2-sftp-connector"
version = "0.1.0"
description = "Fivetran custom connector that fetches BAI2-format cash management files from an SFTP server and loads all transactions into a single bai2_transactions table in your destination."
requires-python = ">=3.11,<=3.15"
dependencies = [
    "paramiko==3.5.1",
]
