[project]
name = "microsoft-excel"
version = "0.1.0"
description = "This connector fetches Microsoft Excel files from AWS S3 and processes them using three different methods to extract the data: - pandas library, - python-calamine library, and - openpyxl library."
dependencies = [
    "boto3==1.38.14",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "python-calamine==0.6.2",
]
