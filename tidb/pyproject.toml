[project]
name = "tidb"
description = "This example demonstrates a source connector that reads rows from a TiDB database and upserts them into a Fivetran destination using the Connector SDK."
dependencies = [
    "pytidb>=0.0.11",  # For connecting to TiDB database
    "certifi>=2026.10.19",  # For CA bundle used in TLS connections
]
