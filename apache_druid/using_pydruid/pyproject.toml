[project]
name = "apache-druid-using-pydruid"
version = "0.1.0"
description = "This connector syncs data from Apache Druid datasources into Fivetran using the PyDruid Python library, allowing you to replicate event and analytics data into your destination."
requires-python = ">=3.10,<=3.14"
dependencies = [
    "pydruid>0.6.5",
]
