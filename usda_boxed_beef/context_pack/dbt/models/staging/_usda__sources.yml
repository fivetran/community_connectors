version: 2

sources:
  - name: usda
    description: >
      The USDA boxed beef connector's tables, read-only. Report 2453 (LM_XB403) is daily; report 2460 (LM_XB456,
      Prime cuts) is weekly. Every price is U.S. dollars per 100 pounds, FOB plant, negotiated sales for delivery
      within 0 to 21 days.
    database: usda_wh
    schema: "{{ var('source_schema') }}"
    tables:
      - name: reports
        description: One row per report and report date, from the Summary section.
      - name: cutout_values
        description: Choice and Select cutout values and their change from the prior report day, report 2453.
      - name: primal_values
        description: Composite primal values, report 2453.
      - name: cut_prices
        description: Negotiated price of each boxed beef cut by grade, reports 2453 and 2460.
      - name: ground_beef_prices
        description: Negotiated price of each ground beef and blended ground beef item, report 2453.
      - name: trimmings_prices
        description: Negotiated price of 50% lean trimmings, report 2453.
      - name: volume
        description: Loads and pounds traded by volume class.
