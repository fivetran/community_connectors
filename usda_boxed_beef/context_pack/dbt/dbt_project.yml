# usda_boxed_beef_context: the dbt project behind the USDA boxed beef context pack.
#
# It builds the views an agent reads instead of the connector's seven raw tables. The views put every price in two
# units side by side (U.S. dollars per 100 pounds, as USDA reports it, and dollars per pound), drop no-trade rows from
# every average, mark the weekly Prime report apart from the daily report, and carry each report's correction flag
# and published time.
#
# The local target reads the connector's debug warehouse (profiles.yml). Run from this dbt/ directory:
#   dbt build --profiles-dir .

name: usda_boxed_beef_context
version: "1.0.0"
config-version: 2

profile: usda_boxed_beef_context

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  require_generic_test_arguments_property: true

vars:
  # The schema the connector's tables sit in, inside the attached warehouse. fivetran debug writes to tester.
  source_schema: "tester"

models:
  usda_boxed_beef_context:
    # Views only: the tables are small, and a view always reads the latest sync.
    +materialized: view
    +tags: ["usda_boxed_beef_context"]
    # Descriptions land in the warehouse, where an agent reading the catalog sees them.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +tags: ["staging"]
    marts:
      +tags: ["marts"]

data_tests:
  usda_boxed_beef_context:
    +tags: ["usda_boxed_beef_context"]
